services:
  - type: web
    name: curriculoai-projeto
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-3.6-flash"
      - key: REQUEST_TIMEOUT_SECONDS
        value: "30"
      - key: ALLOWED_ORIGINS
        value: ""
